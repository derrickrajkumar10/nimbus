[project]
name = "nimbus-contracts"
version = "0.1.0"
description = "Shared data contracts for NIMBUS: entities, events, Segment IDs."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus_contracts"]

[tool.pytest.ini_options]
pythonpath = ["."]
